<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reaction Display</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:transparent}
.emoji{position:absolute;bottom:-80px;font-size:clamp(44px,6vw,100px);animation:rise 4.2s linear forwards;filter:drop-shadow(0 3px 5px #0004);pointer-events:none}
@keyframes rise{0%{transform:translateY(0) scale(.8) rotate(0deg);opacity:0}10%{opacity:1}50%{transform:translateY(-50vh) scale(1.05) rotate(8deg)}100%{transform:translateY(-115vh) scale(1.2) rotate(-8deg);opacity:0}}
.hud{position:absolute;right:18px;top:18px;padding:8px 14px;border-radius:999px;background:#0008;color:#fff;font:600 16px Arial,"Noto Sans KR",sans-serif;backdrop-filter:blur(4px)}
</style>
</head>
<body>
<div id="stage"></div><div id="hud" class="hud">❤️ 0 &nbsp; 👍 0 &nbsp; 😎 0</div>
<script>
const stage=document.getElementById('stage'), hud=document.getElementById('hud');
const emoji={heart:'❤️',like:'👍',cool:'😎'};
function update(c){hud.textContent=`❤️ ${c.heart}   👍 ${c.like}   😎 ${c.cool}`;}
function pop(type){
  const e=document.createElement('div'); e.className='emoji'; e.textContent=emoji[type]||'❤️';
  e.style.left=(5+Math.random()*90)+'%'; e.style.animationDuration=(3.5+Math.random()*1.8)+'s';
  stage.appendChild(e); setTimeout(()=>e.remove(),6000);
}
let ws;
function connect(){
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${proto}://${location.host}`);
  ws.onmessage=e=>{const d=JSON.parse(e.data); if(d.counts)update(d.counts); if(d.event==='reaction')pop(d.type);};
  ws.onclose=()=>setTimeout(connect,1000);
}
connect();
</script>
</body>
</html>
